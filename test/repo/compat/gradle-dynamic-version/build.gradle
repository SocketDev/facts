// Dynamic-version conformance fixture for socket-facts.init.gradle.
//
// Nothing in this file names a version the emitter is expected to report. The
// project version is read from a file the harness writes per run, and every
// dependency is asked for by a selector — a wildcard, a bounded range, and a
// SNAPSHOT — that the resolver has to widen against the generated local
// repository. An implementation that reads a cache, or parses this file
// statically, produces `1.+` / `[1.0,2.0)` / a stale version and fails.
//
// The local repository (localrepo/) is generated by
// ../lib/dynamic-version-workspace.mts, so the build runs fully offline.
apply plugin: 'java'

group = 'demo'
version = new File(projectDir, 'computed-version.txt').text.trim()

repositories {
  maven { url file('localrepo').toURI() }
}

dependencies {
  implementation 'demo.dyn:widget:1.+'
  implementation 'demo.dyn:gadget:[1.0,2.0)'
  implementation 'demo.dyn:sprocket:1.0-SNAPSHOT'
}
